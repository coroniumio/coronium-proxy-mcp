name: publish-npm
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for npm Trusted Publishing (OIDC, tokenless)
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5
      - run: npm ci || npm install
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # used only if a token secret exists; trusted publishing ignores it
